<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jx Care: skin and hair care, kept on your phone</title>
    <meta
      name="description"
      content="Jx Care keeps track of your skin and hair care products, when each one expires, what to use morning and evening, and how your skin changes week to week. Free, private, in Lithuanian and English."
    />
    <meta name="theme-color" content="#b83a6e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#7a2550" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Jx Care" />
    <meta
      property="og:description"
      content="Skin and hair care, kept on your phone. Free, private, in Lithuanian and English."
    />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Sets the saved theme and language before the first paint, so nothing flashes or shifts.
      try {
        var saved = JSON.parse(localStorage.getItem('jx-care-landing') || '{}');
        var root = document.documentElement;
        if (saved.theme === 'dark' || saved.theme === 'light') root.classList.add(saved.theme);
        var lang = saved.locale || ((navigator.languages || [])[0] || '').toLowerCase().slice(0, 2);
        root.lang = lang === 'lt' ? 'lt' : 'en';
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
