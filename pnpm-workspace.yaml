# pnpm settings for the app. The website in landing/ is a separate pnpm project with its own
# lockfile, so its React version never mixes with the app's.

# A flat node_modules, like npm made, so Metro, Jest and Expo autolinking find every package.
nodeLinker: hoisted

# Storybook asks for react-native-safe-area-context 5.8; it runs on the version the Expo SDK pins.
peerDependencyRules:
  allowAny:
    - react-native-safe-area-context

allowBuilds:
  esbuild: true
  # Jest's file watcher ships prebuilt binaries; its install script only builds from source.
  '@parcel/watcher': false
  # Jest's resolver: its native binding comes as an optional dependency, the script only checks it.
  unrs-resolver: false

# Run package.json scripts in pnpm's own shell, so `VAR=value command` works on Windows too.
shellEmulator: true

# NativeWind 5's CSS compiler (react-native-css, which loads Expo's copy of lightningcss) fails
# on lightningcss 1.31 and newer ("expected an object-like struct named Specifier"). Expo accepts
# ^1.30.1, so both copies stay on 1.30.1 until react-native-css supports the newer releases.
overrides:
  '@expo/metro-config>lightningcss': 1.30.1
  'react-native-css>lightningcss': 1.30.1
